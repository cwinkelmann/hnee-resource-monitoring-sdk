[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hnee-resource-monitoring"
version = "0.1.0"
description = "Python SDK for the HNEE GPU booking server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tzdata; sys_platform == \"win32\"",  # Windows ships no IANA time-zone data
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
